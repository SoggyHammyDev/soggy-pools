manifestVersion: 1
id: soggy-pools-xec-solo
category: bitcoin
name: XEC Solo Pool
icon: "https://raw.githubusercontent.com/SoggyHammyDev/soggy-pools/main/soggy-pools-xec-solo/icon.png?v=013"
version: "0.1.9"
tagline: Solo mine eCash with Bitcoin ABC and CKPool
description: >-
  A self-hosted eCash (XEC) SHA-256 solo mining pool for Umbrel. Runs Bitcoin ABC,
  Bitcoin ABC's eCash-aware CKPool fork, and a local ZEC-style dashboard for node
  sync, peers, miners, shares, effective Heartbeat/RTT difficulty, payout settings,
  pruning, and block history. The pool uses a fixed ecash: payout address, accepts
  friendly worker names, charges a 0% pool fee, and keeps Bitcoin ABC RPC private
  inside the app network.
developer: SoggyHammyDev
