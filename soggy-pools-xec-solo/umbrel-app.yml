port: 3281
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Brings the XEC dashboard up to BCH-style parity with persistent Best Diff records,
  actual per-session accepted share counts, cleaner miner names and natural sorting,
  improved mining difficulty formatting, five-row Recent Shares, and safer difficulty
  settings validation while preserving eCash Heartbeat / RTT target handling.