repo: https://github.com/SoggyHammyDev/soggy-pools
support: https://github.com/SoggyHammyDev/soggy-pools/issues
port: 3281
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fixes Umbrel cross-app Docker DNS collisions with the BCH Solo Pool by giving
  every XEC service a unique network alias and isolating Bitcoin ABC + CKPool on a
  private app-only bridge. The XEC dashboard can no longer resolve the BCH adapter
  or CKPool by a generic service name. Keeps Bitcoin ABC 0.33.11, 5,000 MiB default
  pruning, eCash-aware CKPool, port 3335 Stratum, and SoggyPools On Umbrel coinbase.
submitter: SoggyHammyDev

