gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Reworks SHA256 VarDiff into a SoggyPools-managed policy while keeping minimum,
  starting, and maximum share difficulty user configurable. VarDiff now targets
  CKPool's native adaptive difficulty with configurable minimum, starting, and maximum difficulty
  band, limits each adjustment to 2x up or down, and gives new miners a 60-second
  grace period. The Settings page now exposes only Min Diff, Start Diff, and Max
  Diff with validation that Min <= Start <= Max.
submitter: SoggyHammyDev

