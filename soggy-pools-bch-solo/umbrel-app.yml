manifestVersion: 1
id: soggy-pools-bch-solo
category: bitcoin
name: BCH Solo Pool

icon: "https://raw.githubusercontent.com/SoggyHammyDev/soggy-pools/main/soggy-pools-bch-solo/icon.png?v=0193"
version: "0.1.99"
tagline: Solo mine Bitcoin Cash with BCHN and CKPool
description: >-
  A self-hosted Bitcoin Cash solo mining node for Umbrel. Runs Bitcoin Cash Node
  (BCHN), a BCH-focused CKPool fork, and a local dashboard for node sync, peers,
  workers, shares, hashrate, difficulty, payout settings, and block history.
  Mining is non-custodial: block rewards are generated directly to the configured
  BCH address (or to a miner-provided BCH address when solo username payout is used).
