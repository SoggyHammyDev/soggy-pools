server {
  listen 8080;
  server_name _;

  location /api/ {
    proxy_pass http://adapter:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
