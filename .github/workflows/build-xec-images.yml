name: Build XEC Solo images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "soggy-pools-xec-solo/**"
      - ".github/workflows/build-xec-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-xec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [web, adapter, ckpool, node]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' soggy-pools-xec-solo/umbrel-app.yml | head -n1)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./soggy-pools-xec-solo/${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/soggyhammydev/xec-solo-${{ matrix.component }}:${{ steps.version.outputs.value }}
            ghcr.io/soggyhammydev/xec-solo-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SoggyHammyDev/soggy-pools
            org.opencontainers.image.title=Soggy Pools XEC Solo ${{ matrix.component }}
          cache-from: type=gha,scope=xec-solo-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=xec-solo-${{ matrix.component }}

      - name: Verify published image
        run: docker buildx imagetools inspect "ghcr.io/soggyhammydev/xec-solo-${{ matrix.component }}:${{ steps.version.outputs.value }}"
