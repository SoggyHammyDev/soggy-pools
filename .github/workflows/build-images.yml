name: Build BCH Solo images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: soggyhammydev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [web, adapter, ckpool, bchn]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Umbrel app version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' soggy-pools-bch-solo/umbrel-app.yml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read version from soggy-pools-bch-solo/umbrel-app.yml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building BCH Solo Pool $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./soggy-pools-bch-solo/${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bch-solo-${{ matrix.component }}:${{ steps.app.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bch-solo-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SoggyHammyDev/soggy-pools
            org.opencontainers.image.version=${{ steps.app.outputs.version }}
            org.opencontainers.image.title=BCH Solo Pool - ${{ matrix.component }}
          cache-from: type=gha,scope=bch-solo-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=bch-solo-${{ matrix.component }}

      - name: Verify GHCR image exists
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_OWNER}/bch-solo-${{ matrix.component }}:${{ steps.app.outputs.version }}" >/dev/null
          echo "Published ${REGISTRY}/${IMAGE_OWNER}/bch-solo-${{ matrix.component }}:${{ steps.app.outputs.version }}"
